name: Build QuickPos APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Assemble Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/quickpos/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          cp app.gradle.kts app/build.gradle.kts
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Quick POS Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/quickpos/app/MainActivity.kt
          package com.quickpos.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.barcode.BarcodeScanning
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null
              private var pendingJsonExport: String? = null

              private val cameraLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  val bitmap = result.data?.extras?.get("data") as? Bitmap
                  if (bitmap != null) {
                      processImageWithMlKit(bitmap)
                  }
              }

              private val permissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                  if (granted) openCamera() else Toast.makeText(this, "يرجى منح إذن الكاميرا", Toast.LENGTH_SHORT).show()
              }

              private val importFileLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  fileUploadCallback?.onReceiveValue(if (uri != null) arrayOf(uri) else null)
                  fileUploadCallback = null
              }

              private val exportFileLauncher = registerForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri ->
                  if (uri != null && pendingJsonExport != null) {
                      contentResolver.openOutputStream(uri)?.use { it.write(pendingJsonExport!!.toByteArray()) }
                      Toast.makeText(this, "تم حفظ النسخة الاحتياطية بنجاح", Toast.LENGTH_SHORT).show()
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                  }
                  webView.addJavascriptInterface(WebAppBridge(), "AndroidBridge")
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          fileUploadCallback = filePathCallback
                          importFileLauncher.launch("application/json")
                          return true
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun openCamera() {
                  val intent = Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                  cameraLauncher.launch(intent)
              }

              private fun processImageWithMlKit(bitmap: Bitmap) {
                  val image = InputImage.fromBitmap(bitmap, 0)
                  val barcodeScanner = BarcodeScanning.getClient()
                  val textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

                  barcodeScanner.process(image).addOnSuccessListener { barcodes ->
                      val code = barcodes.firstOrNull()?.rawValue ?: ""
                      textRecognizer.process(image).addOnSuccessListener { visionText ->
                          val text = visionText.text ?: ""
                          val safeCode = JSONObject.quote(code)
                          val safeText = JSONObject.quote(text)
                          webView.post {
                              webView.evaluateJavascript("window.onNativeScanResult($safeCode, $safeText)", null)
                          }
                      }
                  }
              }

              inner class WebAppBridge {
                  @JavascriptInterface
                  fun startCameraScan(mode: String) {
                      runOnUiThread {
                          if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                              openCamera()
                          } else {
                              permissionLauncher.launch(Manifest.permission.CAMERA)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun saveJsonFile(jsonContent: String) {
                      pendingJsonExport = jsonContent
                      runOnUiThread {
                          exportFileLauncher.launch("quickpos_backup.json")
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickPos-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
