name: Build QuickPos APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Assemble Android Project Structure
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/quickpos/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          cp app.gradle.kts app/build.gradle.kts
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Quick POS Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/quickpos/app/MainActivity.kt
          package com.quickpos.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.ImageDecoder
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.barcode.BarcodeScanning
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null
              private var pendingJsonExport: String? = null
              private var isGalleryImageRequest: Boolean = false

              private val cameraLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  val extras = result.data?.extras
                  val bitmap: Bitmap? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      extras?.getParcelable("data", Bitmap::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      extras?.get("data") as? Bitmap
                  }
                  if (bitmap != null) {
                      notifyImageCaptured(bitmap)
                      processImageWithMlKit(bitmap)
                  } else {
                      Toast.makeText(this, "لم يتم التقاط صورة", Toast.LENGTH_SHORT).show()
                  }
              }

              private val permissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                  if (granted) {
                      openCamera()
                  } else {
                      Toast.makeText(this, "يرجى منح إذن الكاميرا", Toast.LENGTH_SHORT).show()
                  }
              }

              private val importFileLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (isGalleryImageRequest) {
                      isGalleryImageRequest = false
                      if (uri != null) {
                          handleGalleryUri(uri)
                      }
                      return@registerForActivityResult
                  }

                  fileUploadCallback?.onReceiveValue(if (uri != null) arrayOf(uri) else null)
                  fileUploadCallback = null
              }

              private val exportFileLauncher = registerForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri ->
                  val contentToWrite = pendingJsonExport
                  pendingJsonExport = null
                  if (uri != null && contentToWrite != null) {
                      try {
                          contentResolver.openOutputStream(uri)?.use { stream ->
                              stream.write(contentToWrite.toByteArray(Charsets.UTF_8))
                              stream.flush()
                          }
                          Toast.makeText(this, "تم حفظ الملف بنجاح", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "تعذر حفظ الملف: ${e.localizedMessage}", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }
                  webView.addJavascriptInterface(WebAppBridge(), "AndroidBridge")
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          fileUploadCallback?.onReceiveValue(null)
                          fileUploadCallback = filePathCallback

                          val acceptTypes = fileChooserParams?.acceptTypes
                              ?.filter { it.isNotBlank() }
                              ?.joinToString(",")
                              ?: ""

                          val mimeType = when {
                              acceptTypes.contains("image") -> "image/*"
                              acceptTypes.contains("json") -> "application/json"
                              acceptTypes.isNotBlank() -> acceptTypes
                              else -> "*/*"
                          }
                          isGalleryImageRequest = false
                          return try {
                              importFileLauncher.launch(mimeType)
                              true
                          } catch (_: Exception) {
                              fileUploadCallback?.onReceiveValue(null)
                              fileUploadCallback = null
                              false
                          }
                      }
                  }
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun uriToBitmap(uri: Uri): Bitmap? {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          val source = ImageDecoder.createSource(contentResolver, uri)
                          ImageDecoder.decodeBitmap(source) { decoder, _, _ ->
                              decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                              decoder.isMutableRequired = true
                          }
                      } else {
                          @Suppress("DEPRECATION")
                          MediaStore.Images.Media.getBitmap(contentResolver, uri)
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun handleGalleryUri(uri: Uri) {
                  try {
                      val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() }
                      if (bytes != null && bytes.isNotEmpty()) {
                          val base64 = Base64.encodeToString(bytes, Base64.NO_WRAP)
                          val mime = contentResolver.getType(uri) ?: "image/jpeg"
                          val dataUrl = JSONObject.quote("data:$mime;base64,$base64")
                          webView.post {
                              webView.evaluateJavascript(
                                  "window.onGalleryImageSelected && window.onGalleryImageSelected($dataUrl)",
                                  null
                              )
                          }
                      }
                      val bitmap = uriToBitmap(uri)
                      if (bitmap != null) {
                          processImageWithMlKit(bitmap)
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "تعذر قراءة الصورة من المعرض", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun notifyImageCaptured(bitmap: Bitmap) {
                  try {
                      val stream = java.io.ByteArrayOutputStream()
                      bitmap.compress(Bitmap.CompressFormat.JPEG, 85, stream)
                      val base64 = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)
                      val dataUrl = JSONObject.quote("data:image/jpeg;base64,$base64")
                      webView.post {
                          webView.evaluateJavascript(
                              "window.onCameraImageCaptured && window.onCameraImageCaptured($dataUrl)",
                              null
                          )
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun openCamera() {
                  try {
                      val intent = Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                      cameraLauncher.launch(intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "تعذر فتح الكاميرا", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun processImageWithMlKit(bitmap: Bitmap) {
                  try {
                      val image = InputImage.fromBitmap(bitmap, 0)
                      val barcodeScanner = BarcodeScanning.getClient()
                      val textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

                      barcodeScanner.process(image)
                          .addOnSuccessListener { barcodes ->
                              val code = barcodes.firstOrNull()?.rawValue ?: ""
                              textRecognizer.process(image)
                                  .addOnSuccessListener { visionText ->
                                      val text = visionText.text ?: ""
                                      sendScanResultToWeb(code, text)
                                  }
                                  .addOnFailureListener {
                                      sendScanResultToWeb(code, "")
                                  }
                          }
                          .addOnFailureListener {
                              textRecognizer.process(image)
                                  .addOnSuccessListener { visionText ->
                                      val text = visionText.text ?: ""
                                      sendScanResultToWeb("", text)
                                  }
                                  .addOnFailureListener {
                                      sendScanResultToWeb("", "")
                                  }
                          }
                  } catch (_: Exception) {
                      sendScanResultToWeb("", "")
                  }
              }

              private fun sendScanResultToWeb(code: String, text: String) {
                  val safeCode = JSONObject.quote(code)
                  val safeText = JSONObject.quote(text)
                  webView.post {
                      webView.evaluateJavascript(
                          "window.onNativeScanResult && window.onNativeScanResult($safeCode, $safeText)",
                          null
                      )
                  }
              }

              inner class WebAppBridge {
                  @JavascriptInterface
                  fun startCameraScan(mode: String) {
                      runOnUiThread {
                          if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                              openCamera()
                          } else {
                              permissionLauncher.launch(Manifest.permission.CAMERA)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun pickImageFromGallery() {
                      runOnUiThread {
                          isGalleryImageRequest = true
                          try {
                              importFileLauncher.launch("image/*")
                          } catch (_: Exception) {
                              isGalleryImageRequest = false
                              Toast.makeText(this@MainActivity, "تعذر فتح المعرض", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun saveJsonFile(jsonContent: String) {
                      pendingJsonExport = jsonContent
                      runOnUiThread {
                          try {
                              exportFileLauncher.launch("quickpos_backup.json")
                          } catch (_: Exception) {
                              Toast.makeText(this@MainActivity, "تعذر فتح نافذة الحفظ", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickPos-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
