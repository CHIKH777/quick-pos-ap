<button type="button" onclick="pickDeviceImage()" style="width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;background:#374151;color:#fff;font-weight:bold;cursor:pointer;">
  🖼️ اختيار صورة من الجهاز
</button>

<script>
  function pickDeviceImage() {
    if (window.AndroidBridge && typeof window.AndroidBridge.pickImageFromGallery === "function") {
      window.AndroidBridge.pickImageFromGallery();
    } else {
      alert("ميزة اختيار الصورة من الجهاز تعمل داخل تطبيق الأندرويد فقط.");
    }
  }

  window.onNativeScanResult = function(barcode, text) {
    const barcodeInput = document.querySelector('input[placeholder*="الباركود"], #barcode, [name*="barcode"]');
    const nameInput = document.querySelector('input[placeholder*="اسم"], #productName, #name, [name*="name"]');
    if (barcode && barcodeInput) {
      barcodeInput.value = barcode;
      barcodeInput.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (text && nameInput && !nameInput.value) {
      const firstLine = text.split("\n").map(s => s.trim()).find(Boolean) || text.trim();
      nameInput.value = firstLine;
      nameInput.dispatchEvent(new Event("input", { bubbles: true }));
    }
  };

  window.onGalleryImageSelected = function(dataUrl) {
    const previewImg = document.querySelector("#previewImage, .product-preview");
    if (previewImg) {
      previewImg.src = dataUrl;
      previewImg.style.display = "block";
    }
  };
</script>
